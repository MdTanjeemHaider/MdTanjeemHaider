name: Generate snake animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Checkout repo
      - name: Checkout Repo
        uses: actions/checkout@v6

      # generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            resources/github-contribution-grid-snake-light.svg?palette=github-light
            resources/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Push to repo
      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resources/*.svg
          git diff --staged --quiet || git commit -m "Update snake animation"
          git push
